<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KLIK SE PARIMO - Sensus Ekonomi 2026</title>
    <!-- Favicon -->
    <link
      rel="icon"
      type="image/png"
      href="Logo_Sensus_Ekonomi_2026-removebg-preview.png"
    />
    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <!-- Font Awesome untuk Ikon -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', "sans-serif"],
            },
            colors: {
              brand: {
                50: "#fff7ed", // Oranye sangat pudar (background)
                100: "#ffedd5", // Oranye pudar
                300: "#fdba74", // Oranye muda (border)
                500: "#f97316", // Oranye utama (focus/aksesoris)
                600: "#ea580c", // Oranye (gradient end)
                700: "#c2410c", // Oranye gelap (gradient middle)
                900: "#7c2d12", // Oranye sangat gelap (gradient start/teks)
              },
            },
          },
        },
      };
    </script>
    <style>
      body {
        background-color: #f8fafc;
      }
      .glass-card {
        background: rgba(255, 255, 255, 0.95);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      /* Custom Scrollbar untuk area konten */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background-color: rgba(203, 213, 225, 0.6);
        border-radius: 20px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background-color: rgba(148, 163, 184, 0.9);
      }

      /* Animasi masuk bertahap untuk kartu */
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(15px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .animate-fade-in {
        animation: fadeInUp 0.4s ease-out forwards;
        opacity: 0;
      }
    </style>
  </head>
  <!-- Mengubah body menjadi min-h-screen agar menggunakan scroll natural bawaan browser -->
  <body
    class="text-slate-800 antialiased min-h-screen flex flex-col bg-slate-50"
  >
    <!-- Header / Hero Section (Dibuat sticky agar menempel mulus di atas saat di-scroll) -->
    <header
      class="bg-gradient-to-br from-orange-400 via-orange-300 to-orange-200 text-white sticky top-0 flex-shrink-0 shadow-md pt-6 lg:pt-8 z-40"
    >
      <!-- Dekorasi Latar Belakang -->
      <div
        class="absolute top-0 left-0 w-full h-full overflow-hidden z-0 pointer-events-none"
      >
        <div
          class="absolute -top-24 -left-24 w-96 h-96 bg-white opacity-40 rounded-full blur-3xl"
        ></div>
        <div
          class="absolute bottom-0 right-0 w-1/2 h-full bg-amber-100 opacity-40 blur-3xl rounded-tl-full"
        ></div>
      </div>

      <div class="container mx-auto px-6 relative z-10">
        <!-- Flex container: Susunan vertikal di HP, sejajar kiri-kanan di Laptop -->
        <div
          class="flex flex-col lg:flex-row lg:items-center justify-between gap-6 pb-6 lg:pb-8"
        >
          <!-- Kiri: Logo dan Judul -->
          <div class="flex items-center gap-4 md:gap-5">
            <img
              src="Logo_Sensus_Ekonomi_2026-removebg-preview.png"
              alt="Logo Sensus Ekonomi 2026"
              class="w-20 h-20 md:w-24 md:h-24 mix-blend-screen object-contain drop-shadow-sm flex-shrink-0 transition-transform hover:scale-105"
            />
            <div>
              <h2
                class="text-3xl md:text-4xl font-extrabold leading-tight mb-1 drop-shadow-md tracking-tight"
              >
                KLIK SE PARIMO
              </h2>
              <p
                class="text-orange-50 font-medium text-sm md:text-base drop-shadow-sm leading-snug"
              >
                Kumpulan LInk Sensus Ekonomi 2026<br />Kabupaten Parigi Moutong
              </p>
            </div>
          </div>

          <!-- Kanan: Search Bar -->
          <div
            class="w-full lg:w-[400px] xl:w-[480px] flex-shrink-0 mt-2 lg:mt-0"
          >
            <div class="relative">
              <div
                class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none"
              >
                <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
              </div>
              <input
                type="text"
                id="searchInput"
                class="w-full bg-white text-slate-900 rounded-xl py-3.5 pl-12 pr-4 shadow-lg focus:outline-none focus:ring-4 focus:ring-orange-500/30 transition-all text-base placeholder-slate-400 border-0"
                placeholder="Cari formulir, link, atau dokumen..."
              />
            </div>
          </div>
        </div>

        <!-- Kumpulan Filter Kategori dan Sorting -->
        <div
          class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 pb-4"
        >
          <!-- Filter Kategori -->
          <div
            class="flex gap-2 overflow-x-auto scrollbar-hide"
            id="category-filters"
          >
            <!-- Filter tombol akan di-render melalui JS -->
          </div>

          <!-- Fitur Sort / Urutkan -->
          <div class="flex-shrink-0 relative mt-2 sm:mt-0">
            <div
              class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none"
            >
              <i
                class="fa-solid fa-arrow-down-short-wide text-orange-500 text-sm"
              ></i>
            </div>
            <select
              id="sortSelect"
              class="bg-white border border-orange-100 text-slate-700 text-[13px] font-bold rounded-full py-2 pl-9 pr-9 shadow-sm focus:ring-2 focus:ring-orange-500/50 appearance-none cursor-pointer hover:bg-orange-50 transition-colors w-full sm:w-auto"
            >
              <option value="default">Urutkan: Bawaan</option>
              <option value="date-desc">Tanggal (Terbaru)</option>
              <option value="date-asc">Tanggal (Terlama)</option>
              <option value="name-asc">Nama (A-Z)</option>
              <option value="name-desc">Nama (Z-A)</option>
            </select>
            <div
              class="absolute inset-y-0 right-0 pr-3.5 flex items-center pointer-events-none"
            >
              <i class="fa-solid fa-chevron-down text-slate-400 text-xs"></i>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow relative z-10 w-full">
      <div class="container mx-auto px-6 py-6 lg:py-8 relative z-20">
        <!-- Area Grid Link -->
        <div
          id="linksContainer"
          class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"
        >
          <!-- Kartu akan di-render di sini oleh JavaScript -->
        </div>

        <!-- State Kosong (Ketika pencarian tidak ditemukan) -->
        <div
          id="emptyState"
          class="hidden flex-col items-center justify-center py-16 text-center"
        >
          <div
            class="w-20 h-20 bg-slate-200/50 rounded-full flex items-center justify-center text-slate-400 text-3xl mb-4"
          >
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <h3 class="text-lg font-bold text-slate-700 mb-1">
            Tautan tidak ditemukan
          </h3>
          <p class="text-slate-500 text-sm max-w-sm mx-auto">
            Kami tidak dapat menemukan tautan yang cocok dengan kata kunci Anda.
          </p>
        </div>

        <!-- Footer -->
        <footer
          class="mt-16 pt-6 border-t border-slate-200/60 text-center text-slate-400 text-sm"
        >
          <p>
            &copy; 2026 KLIK SE PARIMO - Portal Sensus Ekonomi Kabupaten Parigi
            Moutong.
          </p>
        </footer>
      </div>
    </main>

    <!-- JavaScript Data dan Logika -->
    <script>
      // Data Tautan (Ditambahkan tanggal sesuai tabel)
      const linkData = [
        {
          id: 1,
          title: "Identifikasi Petugas SE 2026",
          category: "Spreadsheet",
          date: "13/05/2026",
          dateVal: "2026-05-13",
          desc: "Data induk identifikasi seluruh petugas Sensus Ekonomi 2026.",
          url: "https://docs.google.com/spreadsheets/d/1QcpUTpGvNrEnHRtzT0ms4FBtqfmqMnYDtFF3JojlyHk/edit",
          icon: "fa-file-excel",
          colorClass: "text-emerald-600",
          bgClass: "bg-emerald-50",
          badgeClass: "bg-emerald-100 text-emerald-700",
        },
        {
          id: 2,
          title: "CAWI General Link",
          category: "Website",
          date: "13/05/2026",
          dateVal: "2026-05-13",
          desc: "Tautan umum e-Survey / CAWI untuk pengumpulan data.",
          url: "https://esurvey.bps.go.id/general/se2026",
          icon: "fa-globe",
          colorClass: "text-blue-600",
          bgClass: "bg-blue-50",
          badgeClass: "bg-blue-100 text-blue-700",
        },
        {
          id: 3,
          title: "Panduan CAWI",
          category: "Dokumen",
          date: "13/05/2026",
          dateVal: "2026-05-13",
          desc: "Buku panduan teknis penggunaan aplikasi CAWI.",
          url: "https://drive.google.com/file/d/1TMGNnOBZrEWyg3aHDKdkg8tKvkUvFDtL/view",
          icon: "fa-file-pdf",
          colorClass: "text-rose-600",
          bgClass: "bg-rose-50",
          badgeClass: "bg-rose-100 text-rose-700",
        },
        {
          id: 4,
          title: "(1) Form Identifikasi Calon Petugas SE",
          category: "Formulir",
          date: "14/05/2026",
          dateVal: "2026-05-14",
          desc: "Formulir kesediaan awal khusus untuk Mitra KEPKA.",
          url: "https://docs.google.com/forms/d/e/1FAIpQLSfeOKAvcq7elr1PdNuuC4sup0ZCz9nvgJcKGOX6UPzKfKj26w/closedform",
          icon: "fa-file-lines",
          colorClass: "text-purple-600",
          bgClass: "bg-purple-50",
          badgeClass: "bg-purple-100 text-purple-700",
        },
        {
          id: 5,
          title: "(2) Form Identifikasi Kesediaan dan Komitmen",
          category: "Formulir",
          date: "14/05/2026",
          dateVal: "2026-05-14",
          desc: "Formulir lanjutan komitmen bertugas (Untuk Mitra KEPKA).",
          url: "https://docs.google.com/forms/d/e/1FAIpQLSeoVUrrf0r-4I1ORL22ywRkOrfawBaAGMQ6CVdh3V8iDnI5GA/closedform",
          icon: "fa-file-lines",
          colorClass: "text-purple-600",
          bgClass: "bg-purple-50",
          badgeClass: "bg-purple-100 text-purple-700",
        },
        {
          id: 6,
          title: "Hasil Verifikasi Mitra KEPKA",
          category: "Spreadsheet",
          date: "14/05/2026",
          dateVal: "2026-05-14",
          desc: "Rekapitulasi status dan hasil verifikasi data Mitra KEPKA.",
          url: "https://docs.google.com/spreadsheets/d/1tsjIq7c_crieNFisfXjw14YV6oxsX_c1nwCjyzD4ZoI/edit",
          icon: "fa-file-excel",
          colorClass: "text-emerald-600",
          bgClass: "bg-emerald-50",
          badgeClass: "bg-emerald-100 text-emerald-700",
        },
        {
          id: 7,
          title: "Formulir Perbaikan Berkas Administrasi",
          category: "Formulir",
          date: "14/05/2026",
          dateVal: "2026-05-14",
          desc: "Jalur unggah ulang bagi peserta yang perlu memperbaiki berkas.",
          url: "https://docs.google.com/forms/d/e/1FAIpQLScnVtI6UIHGXebynVAVj57OUclqb7WJtaZYzxqltTw6Xe504A/viewform",
          icon: "fa-file-lines",
          colorClass: "text-purple-600",
          bgClass: "bg-purple-50",
          badgeClass: "bg-purple-100 text-purple-700",
        },
        {
          id: 8,
          title: "Hasil Unggah Data Seleksi Administrasi",
          category: "Spreadsheet",
          date: "14/05/2026",
          dateVal: "2026-05-14",
          desc: "Rekap data masuk dari proses seleksi administrasi awal.",
          url: "https://docs.google.com/spreadsheets/d/1iuXMzBUap_XXzvR5mStBF1tAC2wiLTfwxwW6EKd299Q/edit?gid=2005056794#gid=2005056794",
          icon: "fa-file-excel",
          colorClass: "text-emerald-600",
          bgClass: "bg-emerald-50",
          badgeClass: "bg-emerald-100 text-emerald-700",
        },
        {
          id: 9,
          title: "Seleksi Administrasi Mitra Tambahan",
          category: "Spreadsheet",
          date: "14/05/2026",
          dateVal: "2026-05-14",
          desc: "Daftar dan status rekrutmen gelombang mitra tambahan.",
          url: "https://docs.google.com/spreadsheets/d/1hziNl_ciOmdDAGumgtTz7eIyKwIee3Q0CPOTlqgVhf0/edit?gid=1739040311#gid=1739040311",
          icon: "fa-file-excel",
          colorClass: "text-emerald-600",
          bgClass: "bg-emerald-50",
          badgeClass: "bg-emerald-100 text-emerald-700",
        },
        {
          id: 10,
          title: "Dokumen MoM Rapat 13 Mei 2026",
          category: "Dokumen",
          date: "13/05/2026",
          dateVal: "2026-05-13",
          desc: "Minutes of Meeting (MoM) rapat pada tanggal 13 Mei 2026.",
          url: "https://drive.google.com/file/d/1afJ0J7-B4NL4ZVVerKVGRJpUHNHU-nyj/view?usp=sharing",
          icon: "fa-file-lines",
          colorClass: "text-rose-600",
          bgClass: "bg-rose-50",
          badgeClass: "bg-rose-100 text-rose-700",
        },
        {
          id: 11,
          title: "Pedoman Administrasi Sensus Ekonomi",
          category: "Website",
          date: "20/05/2026",
          dateVal: "2026-05-20",
          desc: "Panduan administrasi Sensus Ekonomi 2026 di situs resmi PAKSE.",
          url: "https://sites.google.com/view/pakse2026/home",
          icon: "fa-globe",
          colorClass: "text-blue-600",
          bgClass: "bg-blue-50",
          badgeClass: "bg-blue-100 text-blue-700",
        },
      ];

      let activeFilter = "Semua";
      const categories = [
        "Semua",
        "Spreadsheet",
        "Formulir",
        "Website",
        "Dokumen",
      ];

      // Elements
      const linksContainer = document.getElementById("linksContainer");
      const searchInput = document.getElementById("searchInput");
      const emptyState = document.getElementById("emptyState");
      const filtersContainer = document.getElementById("category-filters");
      const sortSelect = document.getElementById("sortSelect");

      // Fungsi Render Kartu
      function renderCards(data) {
        linksContainer.innerHTML = "";

        if (data.length === 0) {
          linksContainer.classList.add("hidden");
          emptyState.classList.remove("hidden");
          emptyState.classList.add("flex");
        } else {
          linksContainer.classList.remove("hidden");
          emptyState.classList.add("hidden");
          emptyState.classList.remove("flex");

          data.forEach((item, index) => {
            const delay = index * 0.04; // Efek stagger
            const card = document.createElement("div");
            card.className = `glass-card rounded-2xl p-5 shadow-sm hover:shadow-lg hover:border-orange-200 transition-all duration-300 hover:-translate-y-1 flex flex-col h-full animate-fade-in`;
            card.style.animationDelay = `${delay}s`;

            card.innerHTML = `
                        <div class="flex items-start justify-between mb-3">
                            <div class="w-10 h-10 rounded-xl ${item.bgClass} flex items-center justify-center text-lg">
                                <i class="fa-solid ${item.icon} ${item.colorClass}"></i>
                            </div>
                            <span class="text-[11px] font-bold px-2.5 py-1 rounded-full ${item.badgeClass}">
                                ${item.category}
                            </span>
                        </div>
                        <h3 class="text-base font-bold text-slate-800 leading-tight mb-1.5 line-clamp-2" title="${item.title}">
                            ${item.title}
                        </h3>
                        <div class="flex items-center text-[11px] text-slate-400 font-semibold mb-3">
                            <i class="fa-regular fa-calendar-days mr-1.5"></i> Diperbarui: ${item.date}
                        </div>
                        <p class="text-slate-500 text-[13px] mb-5 flex-grow line-clamp-2">
                            ${item.desc}
                        </p>
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
                           class="w-full py-2.5 px-4 bg-white border border-slate-200 text-slate-600 text-sm font-bold rounded-xl hover:bg-orange-50 hover:text-orange-600 hover:border-orange-300 transition-colors flex items-center justify-center gap-2 group shadow-sm mt-auto">
                            <span>Akses Tautan</span>
                            <i class="fa-solid fa-arrow-up-right-from-square text-xs opacity-50 group-hover:opacity-100 group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all"></i>
                        </a>
                    `;
            linksContainer.appendChild(card);
          });
        }
      }

      // Fungsi Render Filter Kategori
      function renderFilters() {
        filtersContainer.innerHTML = "";
        categories.forEach((cat) => {
          const btn = document.createElement("button");
          const isActive = activeFilter === cat;

          btn.className = `whitespace-nowrap px-4 py-1.5 rounded-full text-[13px] font-bold transition-all shadow-sm ${
            isActive
              ? "bg-orange-500 text-white shadow-orange-500/40"
              : "bg-white text-slate-600 hover:bg-orange-50 hover:text-orange-600 border border-slate-200"
          }`;
          btn.innerText = cat;
          btn.onclick = () => {
            activeFilter = cat;
            renderFilters(); // Update visual tombol
            filterData(); // Update kartu
          };
          filtersContainer.appendChild(btn);
        });
      }

      // Fungsi Filter & Sort Data
      function filterData() {
        const query = searchInput.value.toLowerCase();
        const sortVal = sortSelect.value;

        // 1. Proses Filtering (Pencarian & Kategori)
        let filtered = linkData.filter((item) => {
          const matchQuery =
            item.title.toLowerCase().includes(query) ||
            item.desc.toLowerCase().includes(query);
          const matchCategory =
            activeFilter === "Semua" || item.category === activeFilter;
          return matchQuery && matchCategory;
        });

        // 2. Proses Sorting (Pengurutan)
        filtered.sort((a, b) => {
          if (sortVal === "date-desc") {
            // Terbaru ke Terlama
            return new Date(b.dateVal) - new Date(a.dateVal);
          } else if (sortVal === "date-asc") {
            // Terlama ke Terbaru
            return new Date(a.dateVal) - new Date(b.dateVal);
          } else if (sortVal === "name-asc") {
            // A-Z
            return a.title.localeCompare(b.title);
          } else if (sortVal === "name-desc") {
            // Z-A
            return b.title.localeCompare(a.title);
          }
          // Jika default, biarkan sesuai ID asli
          return a.id - b.id;
        });

        renderCards(filtered);
      }

      // Event Listener
      searchInput.addEventListener("input", filterData);
      sortSelect.addEventListener("change", filterData);

      // Inisialisasi Awal
      renderFilters();
      renderCards(linkData);
    </script>
  </body>
</html>
